<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Medicines — Professional Store Management</title><link rel="stylesheet" href="/css/style.css"></head>

<div id="toast"></div>
